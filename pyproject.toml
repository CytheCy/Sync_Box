[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sync-box"
version = "1.0.0"
description = "Conservative two-way synchronization between a local folder and Box"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boxsdk>=10,<11",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6,<7"]

[project.scripts]
sync-box = "sync_box.cli:main"
sync-box-gui = "sync_box.gui:main"

[tool.setuptools.package-data]
sync_box = [
    "schema.sql",
    "migrations/*.sql",
    "resources/icons/*.svg",
]
